# TRUE COLLECTIVE Phase 1 — [env.tc] fragment (merge into wrangler.toml)
# IDs from Cloudflare-bindings MCP 2026-10-20. Do not reuse Macro-inc UUIDs.
# Full [env.tc] also applied in services/sync-service/wrangler.toml when present.

[env.tc]
name = "tc-macro-sync"

[env.tc.vars]
ENVIRONMENT = "tc"
SPS_URL = "https://tc-macro-gateway.sliplane.app/search-processing"
DSS_URL = "https://tc-macro-gateway.sliplane.app/dss"
LEXICAL_SERVICE_URL = "https://tc-macro-gateway.sliplane.app/lexical"

[env.tc.durable_objects]
bindings = [
  { name = "DOCUMENT_SYNC_SESSION", class_name = "DocumentSyncSession" },
]

[[env.tc.r2_buckets]]
binding = "DOCUMENT_SNAPSHOT_BUCKET"
bucket_name = "tc-macro-document-snapshots"

[[env.tc.d1_databases]]
binding = "USER_PEER_MAPPING"
migrations_dir = "./database/user-peer-mapping/migrations/"
database_name = "tc-macro-user-peer-mapping"
database_id = "7c72c4a7-4cf2-46cb-871a-55150d01c763"

[[env.tc.kv_namespaces]]
binding = "DOCUMENT_VERSIONING_KV"
id = "0f2aa8b3f5d244d4a3209cbf98027e25"

[[env.tc.kv_namespaces]]
binding = "SNAPSHOT_STORE_KV"
id = "94752ca5eca4488db8d24f46027c4f9b"

[[env.tc.migrations]]
tag = "v1"
new_sqlite_classes = ["DocumentSyncSession"]
